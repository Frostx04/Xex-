<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Наш список</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow candle-lit column; one question at a time, result reads like a personal card. */
:root {
  --bg: #170d14;
  --surface: #23141e;
  --surface-2: #2e1a27;
  --line: #43293a;
  --fg: #f4e7ec;
  --muted: #b596a6;
  --accent: #f07f93;
  --amber: #f2b46d;
  --no: #8c6a7c;
  --display: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
  --body: "Manrope", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(240,127,147,.16), transparent 60%),
    radial-gradient(80% 40% at 100% 100%, rgba(242,180,109,.08), transparent 70%),
    var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
}
.wrap { max-width: 620px; margin: 0 auto; padding-inline: 20px; padding-block: 36px 56px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(44px, 11vw, 72px); font-style: italic; letter-spacing: -.01em; }
h2 { font-size: clamp(30px, 7vw, 42px); font-style: italic; }
h3 { font-size: 24px; }
p { margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lead { color: var(--muted); font-size: 17px; max-width: 46ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

.btn {
  border: 0; border-radius: 999px; padding: 15px 28px; font-weight: 700; font-size: 16px;
  background: linear-gradient(100deg, var(--accent), var(--amber)); color: #2a0f1b;
  box-shadow: 0 8px 30px rgba(240,127,147,.25);
  transition: transform .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 12px 22px; font-weight: 600; color: var(--fg); }
.btn-ghost:hover { border-color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* intro */
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 14px; }
.facts b { color: var(--fg); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }

/* quiz */
.progress { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--amber)); transition: width .35s ease; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.counter { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.qtext { font-family: var(--display); font-size: clamp(28px, 6.4vw, 38px); font-weight: 600; line-height: 1.15; text-wrap: balance; min-height: 2.4em; }
.qhint { color: var(--muted); font-size: 15px; }
.opt.multi { align-items: center; }
.opt .box { width: 20px; height: 20px; flex: none; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; }
.opt.multi.on .box { background: var(--accent); border-color: var(--accent); }
.opt.multi.on .box::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--bg); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.star { margin-top: 14px; width: 100%; display: flex; gap: 14px; align-items: center; text-align: left; background: transparent; border: 1px dashed var(--line); border-radius: 14px; padding: 12px 16px; color: var(--muted); font-size: 14px; }
.star .sub { font-size: 12px; }
.star-ic { font-size: 24px; line-height: 1; color: var(--muted); width: 26px; text-align: center; }
.star.on { border-style: solid; border-color: var(--amber); color: var(--fg); }
.star.on .star-ic { color: var(--amber); }
.wish { width: 100%; min-height: 140px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 14px; font: inherit; font-size: 16px; resize: vertical; }
.wish:focus { outline: 2px solid var(--amber); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.chip.star-chip { border-color: var(--amber); }
.callout { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.wheel-wrap { position: relative; width: min(320px, 100%); margin: 0 auto; aspect-ratio: 1; max-width: 100%; }
.wheel-wrap svg { width: 100%; height: 100%; display: block; }
.wheel { transform-origin: 150px 150px; transition: transform 4.2s cubic-bezier(.12,.7,.08,1); }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid var(--amber); filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
.wheel-res { text-align: center; font-family: var(--display); font-style: italic; font-size: 28px; min-height: 1.3em; color: var(--amber); }
.qdef { font-size: 14px; color: var(--muted); background: var(--surface); border-left: 2px solid var(--amber); border-radius: 0 10px 10px 0; padding: 10px 14px; }
.qdef b { color: var(--amber); font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; transition: border-color .15s, background .15s, transform .15s;
}
.opt:hover { border-color: var(--muted); }
.opt.on { border-color: var(--accent); background: var(--surface-2); }
.dots { display: flex; gap: 4px; flex: none; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.f { background: var(--accent); }
.opt .lbl { font-weight: 600; }
.opt .sub { color: var(--muted); font-size: 13px; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pick .opt { flex-direction: column; align-items: flex-start; justify-content: center; min-height: 120px; padding: 18px; }
.pick .opt .lbl { font-family: var(--display); font-size: 24px; font-style: italic; line-height: 1.15; }
.or { text-align: center; font-family: var(--display); font-style: italic; color: var(--muted); font-size: 18px; margin-top: -4px; }
.back { background: none; border: 0; color: var(--muted); padding: 6px 0; font-size: 14px; }
.back:hover { color: var(--fg); }
.back[disabled] { opacity: .35; cursor: default; }
.fade { animation: fade .3s ease both; }
@keyframes fade { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* result */
.hero-card {
  background: linear-gradient(160deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px;
}
.hero-card .arch { font-family: var(--display); font-style: italic; font-size: clamp(40px, 10vw, 58px); line-height: 1; margin-block: 6px 12px;
  background: linear-gradient(100deg, var(--accent), var(--amber)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar { display: grid; grid-template-columns: 9.5em 1fr 3em; gap: 12px; align-items: center; font-size: 15px; }
.bar .track { height: 8px; background: var(--surface-2); border-radius: 8px; overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--accent), var(--amber)); }
.bar .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.axis { display: flex; flex-direction: column; gap: 8px; }
.axis .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.axis .line { position: relative; height: 2px; background: var(--line); margin-block: 10px; }
.axis .line b { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%,-50%);
  background: var(--amber); box-shadow: 0 0 0 6px rgba(242,180,109,.18); }
.ideas { display: flex; flex-direction: column; gap: 12px; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.idea .tag { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); font-weight: 700; }
.idea p { color: var(--muted); font-size: 15px; }
.lists { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.lists > div { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.lists h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.lists ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.lists .yes h4 { color: var(--accent); }
.lists .maybe h4 { color: var(--amber); }
.lists .no h4 { color: var(--no); }
.lists .empty { color: var(--muted); font-style: italic; }
.copied { font-size: 13px; color: var(--amber); }
.sep { height: 1px; background: var(--line); border: 0; margin: 0; }

/* illustrations */
.ill { display: block; overflow: visible; }
.ill use { filter: drop-shadow(0 0 14px rgba(240,127,147,.45)); }
.hero-art { position: relative; height: 190px; display: grid; place-items: center; }
.hero-art .main { position: relative; width: min(260px, 66%); height: auto; animation: breathe 4.5s ease-in-out infinite; }
.hero-art .side { position: absolute; width: min(130px, 34%); height: auto; opacity: .9; }
.hero-art .side-l { left: 0; bottom: 0; transform: rotate(-18deg); }
.hero-art .side-r { right: 0; top: 4px; transform: rotate(14deg); }
.hero-art .glow { position: absolute; inset: 10% 15%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240,127,147,.35), transparent); filter: blur(10px); }
.hero-art .float { position: absolute; width: 22px; height: 22px; opacity: .8; animation: rise 6s ease-in-out infinite; }
.hero-art .f1 { left: 30%; top: 6%; }
.hero-art .f2 { right: 14%; top: 22%; width: 16px; height: 16px; animation-delay: -2s; }
.hero-art .f3 { right: 30%; bottom: 4%; width: 12px; height: 12px; animation-delay: -4s; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes rise { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-14px); opacity: 1; } }
.q-art { width: 84px; height: 60px; }
.arch-art { width: 120px; height: 84px; }
.idea-head { display: flex; align-items: center; gap: 14px; }
.idea-head .ill { width: 44px; height: 34px; flex: none; }
@media (max-width: 560px) {
  .lists { grid-template-columns: 1fr; }
  .bar { grid-template-columns: 7.5em 1fr 2.6em; font-size: 14px; }
  .pick { grid-template-columns: 1fr; }
  .pick .opt { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<style>
/* Наш список: темы-лесенки, у каждого пункта «было» и «повторить» */
:root { --done: #7cc4a0; }
.prog { display: flex; flex-direction: column; gap: 8px; }
.prog .num { font-family: var(--display); font-style: italic; font-size: 34px; color: var(--amber); line-height: 1; }
.topic { display: flex; flex-direction: column; gap: 10px; }
.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.item.next { border-color: var(--amber); }
.item.done { opacity: .78; }
.item.done .txt { text-decoration: line-through; text-decoration-color: var(--muted); }
.item .txt { min-width: 0; font-size: 15px; }
.item .tag-next { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); font-weight: 700; margin-bottom: 2px; }
.check { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; padding: 0; }
.check.on { background: var(--done); border-color: var(--done); }
.check.on::after { content: ""; width: 12px; height: 6px; border: 3px solid var(--bg); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -2px); }
.heart { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--line); padding: 4px; }
.heart.on { color: var(--accent); }
.heart[hidden] { display: none; }
.later summary { cursor: pointer; font-weight: 600; color: var(--maybe, #c7a4e8); list-style: none; }
.later summary::-webkit-details-marker { display: none; }
.pick-card { background: linear-gradient(160deg, var(--surface-2), var(--surface)); border: 1px solid var(--accent); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.pick-card .what { font-family: var(--display); font-style: italic; font-size: 26px; line-height: 1.2; }
.empty-state { text-align: center; padding-block: 40px; color: var(--muted); }
</style>

<main class="wrap" id="app"></main>

<script>
const TOPICS = [
  { id: "press", icon: "cuffs", title: "Напор", intro: "Когда тебя берут уверенно и не спрашивают.", steps: [

  { id: "neck", icon: "collar", title: "Шея и загривок", intro: "Всё без давления на горло: только держать и вести.", steps: [

    "Ошейник просто как украшение на вечер",

    "Тяну за кольцо ошейника, чтобы притянуть тебя к себе",
    "Поводок: веду тебя за собой",
    "Ошейник весь вечер, пока я не сниму"] },
  { id: "knees", icon: "collar", title: "На коленях", steps: [
    "Опуститься передо мной на колени во время поцелуев",
    "Встать на колени, когда я прошу",
    "Ждать меня на коленях",
    "Встать на колени по приказу, без вопросов",
    "Минет на коленях по приказу"] },
  { id: "ties", icon: "rope", title: "Связывание", intro: "Лесенка от шарфа до полной беспомощности.", def: "Рядом всегда ножницы. Узлы не затягивают на суставах, руки проверяют каждые 10–15 минут: не немеют ли пальцы.", steps: [
    "Руки связаны шарфом спереди",
    "Руки связаны за спиной",
    "Руки привязаны к кровати",
    "Руки и ноги зафиксированы",
    "Связана полностью, в повязке и не знаешь, что будет дальше"] },
  { id: "blind", icon: "blindfold", title: "Повязка", steps: [
    "Повязка и только прикосновения",
    "Повязка и поцелуи по всему телу: не знаешь, куда будет следующий",
    "Повязка и игрушка",
    "Повязка на весь вечер"] },
  { id: "wax", icon: "wax", title: "Воск", def: "Только специальные свечи для игр с низкой температурой. Начинают с высоты 30–40 см: чем выше, тем капля холоднее.", steps: [
    "Воск на спину",
    "Воск на живот и бёдра",
    "Воск на грудь",
    "Воск, пока ты в повязке",
    "Воск, пока ты связана"] },
  { id: "orgasm", icon: "lock", title: "Контроль оргазма", steps: [
    "Останавливаюсь на самом краю и начинаю снова",
    "Ты просишь разрешения кончить",
    "Кончаешь только по моей команде",
    "Весь вечер без оргазма, я только дразню",
    "Несколько дней без оргазма, пока не разрешу",
    "Кончаешь снова и снова, пока не попросишь остановиться"] },
  { id: "self", icon: "camera", title: "Ласкать себя", steps: [
    "Ласкаешь себя, пока я смотрю",
    "Ласкаешь себя по видеосвязи",
    "Ласкаешь себя по моим командам: быстрее, медленнее, стоп",
    "Ласкаешь себя, пока я делаю с тобой что-то ещё"] },
  { id: "worship", icon: "crown", title: "Поклонение", intro: "Когда всё внимание только тебе.", steps: [
    "Целую тебя с головы до ног, медленно",
    "Начинаю с ног и поднимаюсь выше",
    "Куни, пока ты сама не скажешь «хватит»",
    "Говорю, какая ты красивая, и не останавливаюсь",
    "Ты только принимаешь, тебе ничего нельзя делать в ответ"] },
  { id: "media", icon: "camera", title: "Фото и видео", def: "Всё хранится только у вас двоих, не в облаке. Любое фото или видео удаляется по первой просьбе.", steps: [
    "Фото в белье для меня",
    "Откровенные фото",
    "Короткое видео для меня",
    "Снимаем нас во время секса",
    "Смотрим это видео вместе потом"] },
  { id: "remote", icon: "phone", title: "Пульт и порно", steps: [
    "Пульт у меня, пока ты дома одна",
    "Пульт у меня, пока мы говорим по телефону",
    "Смотрим порно вместе",
    "Каждый присылает сцену, которую хочет повторить",
    "Повторяем сцену из порно"] },
  { id: "roles", icon: "crown", title: "Смена ролей", intro: "Теперь ведёшь ты. Без приказов, просто всё в твоих руках.", steps: [
    "Ты сверху и задаёшь темп",
    "Ты решаешь, когда мне можно тебя трогать",
    "Ты раздеваешь меня так, как хочешь",
    "Ты дразнишь меня и решаешь, когда мне можно кончить",
    "Мои руки связаны, а ты делаешь всё, что хочешь",
    "Ты садишься мне на лицо"] },
  { id: "bath", icon: "tender", title: "Ванна и нежность", steps: [
    "Ванна вместе со свечами и пеной",
    "Массаж в ванне",
    "Ванна после жёсткого вечера, как забота",
    "Просто лежим вместе в ванне и ничего не делаем"] }
];

// пункты вне лесенок
const EXTRA_ITEMS = {
  "x.slow": "Долгая прелюдия, когда никто никуда не торопится",
  "x.massage": "Массаж с тёплым маслом, который плавно переходит в секс",
  "x.sexting": "Переписка с намёками весь день, чтобы к вечеру уже горело",
  "x.new": "Что-то совсем новое, чего у нас ещё не было",
  "x.shirt": "Ты в моей рубашке на голое тело",
  "x.stockings": "Чулки и пояс",
  "x.latex": "Образ в латексе или коже",
  "x.collarOnly": "Ошейник и больше ничего"
};
const EXTRA_GROUP = { title: "Ещё из ваших совпадений", icon: "words" };

const TEXT = {};
TOPICS.forEach(t => t.steps.forEach((s, i) => { TEXT[`${t.id}.${i}`] = s; }));
Object.assign(TEXT, EXTRA_ITEMS);

const KEY = "nash-spisok-v1";
const app = document.getElementById("app");
let st = { i: [], l: [], d: {} };   // i — список, l — на потом, d — 1 было, 2 было и хочется ещё

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function art(id, cls) { return `<svg class="ill ${cls}" viewBox="0 0 120 70" aria-hidden="true"><use href="#i-${id}"/></svg>`; }

function enc(o) {
  const bytes = new TextEncoder().encode(JSON.stringify(o));
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function dec(code) {
  const bin = atob(code.replace(/-/g, "+").replace(/_/g, "/"));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function load() { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && Array.isArray(v.i)) return v; } catch (e) {} return null; }

// отметки из ссылки и с этого телефона объединяются: «было» побеждает «не было»
function merge(a, b) {
  const uniq = arr => [...new Set(arr)].filter(id => TEXT[id]);
  const d = { ...a.d };
  for (const [k, v] of Object.entries(b.d || {})) d[k] = Math.max(d[k] || 0, v);
  const i = uniq([...a.i, ...b.i]);
  const l = uniq([...a.l, ...b.l]).filter(id => !i.includes(id));
  return { i, l, d };
}

function groups(ids) {
  const out = [];
  TOPICS.forEach(t => {
    const items = ids.filter(id => id.startsWith(t.id + ".")).sort((x, y) => +x.split(".")[1] - +y.split(".")[1]);
    if (items.length) out.push({ title: t.title, icon: t.icon, items });
  });
  const extra = ids.filter(id => id.startsWith("x."));
  if (extra.length) out.push({ ...EXTRA_GROUP, items: extra });
  return out;
}

function nextSteps() { return groups(st.i).map(g => g.items.find(id => !st.d[id])).filter(Boolean); }

function itemRow(id, isNext) {
  const d = st.d[id] || 0;
  return `<div class="item ${d ? "done" : ""} ${isNext ? "next" : ""}" data-id="${id}">
    <button class="check ${d ? "on" : ""}" data-act="done" aria-pressed="${d ? "true" : "false"}" aria-label="Было"></button>
    <span class="txt">${isNext ? `<span class="tag-next">Следующий шаг</span>` : ""}${esc(TEXT[id])}</span>
    <button class="heart ${d === 2 ? "on" : ""}" data-act="love" aria-pressed="${d === 2 ? "true" : "false"}" aria-label="Понравилось, хочется ещё" ${d ? "" : "hidden"}>♥</button>
  </div>`;
}

function render(pick) {
  if (!st.i.length && !st.l.length) {
    app.innerHTML = `<section class="stack-lg"><div class="empty-state stack">${art("contract", "arch-art")}<h2>Список пуст</h2>
      <p>Откройте эту страницу по ссылке, которую вам прислали: в ней ваш список.</p></div></section>`;
    return;
  }
  const total = st.i.length, done = st.i.filter(id => st.d[id]).length, loved = st.i.filter(id => st.d[id] === 2);
  const nexts = new Set(nextSteps());
  app.innerHTML = `
    <section class="stack-lg">
      <div class="hero-card stack">
        ${art("contract", "arch-art")}
        <span class="eyebrow">Только для нас двоих</span>
        <div class="arch">Наш список</div>
        <p>Здесь только то, где мы совпали. Отмечайте, что уже было, и сердечком, что хочется повторить.</p>
        <div class="prog"><span class="num">${done} из ${total}</span>
          <div class="progress"><i style="width:${total ? done / total * 100 : 0}%"></i></div></div>
      </div>

      <div class="stack">
        <div class="row"><button class="btn" id="pick">Что сегодня?</button><button class="btn-ghost" id="share">Отправить партнёру</button></div>
        <span class="copied" id="msg" hidden></span>
        <input id="linkField" class="wish" style="min-height:0" readonly hidden>
        ${pick ? `<div class="pick-card"><span class="eyebrow">Сегодня</span><div class="what">${esc(TEXT[pick])}</div>
          <p class="note">Это следующий шаг в одной из тем. Не подходит — нажми ещё раз.</p></div>` : ""}
      </div>

      ${loved.length ? `<div class="callout"><span class="eyebrow">♥ Хочется ещё</span>
        <div class="chips">${loved.map(id => `<span class="chip">${esc(TEXT[id])}</span>`).join("")}</div></div>` : ""}

      ${groups(st.i).map(g => `<div class="topic">
        <div class="topic-head">${art(g.icon, "")}<div><h3>${g.title}</h3>
          <span class="step-of">${g.items.filter(id => st.d[id]).length} из ${g.items.length}</span></div></div>
        <div class="items">${g.items.map(id => itemRow(id, nexts.has(id))).join("")}</div>
      </div>`).join('<hr class="sep">')}

      ${st.l.length ? `<details class="later callout"><summary>Потихоньку, на потом · ${st.l.length}</summary>
        <p class="note">Это не «нет», а «потом». Когда захочется, можно отметить здесь.</p>
        <div class="items">${st.l.map(id => itemRow(id, false)).join("")}</div></details>` : ""}

      <p class="note">Галочки сохраняются на этом телефоне. Чтобы у партнёра тоже обновилось, нажми «Отправить партнёру»: отметки из ссылки сложатся с теми, что уже есть. Светофор работает всегда.</p>
    </section>`;

  app.querySelectorAll(".item button").forEach(b => b.onclick = () => {
    const id = b.closest(".item").dataset.id;
    const d = st.d[id] || 0;
    if (b.dataset.act === "done") { if (d) delete st.d[id]; else st.d[id] = 1; }
    else st.d[id] = d === 2 ? 1 : 2;
    save(); render(pick);
  });
  document.getElementById("pick").onclick = () => {
    const pool = nextSteps();
    if (!pool.length) { render(); say("Всё из списка уже было. Время для нового списка"); return; }
    let p; do { p = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && p === pick);
    render(p);
  };
  document.getElementById("share").onclick = async () => {
    const url = location.href.split("#")[0] + "#s=" + enc(st);
    const f = document.getElementById("linkField"); f.value = url; f.hidden = false;
    try { await navigator.clipboard.writeText(url); say("Ссылка скопирована. Отправь её, и у партнёра появятся твои отметки"); }
    catch (e) { f.focus(); f.select(); say("Скопируй ссылку из поля ниже"); }
  };
}
function say(t) { const m = document.getElementById("msg"); if (m) { m.textContent = t; m.hidden = false; } }

function start() {
  const local = load();
  let fromLink = null;
  if (location.hash.startsWith("#s=")) { try { fromLink = dec(location.hash.slice(3)); } catch (e) {} }
  st = fromLink ? merge(local || { i: [], l: [], d: {} }, fromLink) : (local || st);
  save();
  if (fromLink) history.replaceState(null, "", location.pathname);
  render();
}
// ссылка партнёра, открытая в уже открытой вкладке, меняет только адрес после #
window.addEventListener("hashchange", () => { if (location.hash.startsWith("#s=")) start(); });
start();
</script>
