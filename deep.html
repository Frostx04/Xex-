<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Карта желаний: глубже</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow candle-lit column; one question at a time, result reads like a personal card. */
:root {
  --bg: #170d14;
  --surface: #23141e;
  --surface-2: #2e1a27;
  --line: #43293a;
  --fg: #f4e7ec;
  --muted: #b596a6;
  --accent: #f07f93;
  --amber: #f2b46d;
  --no: #8c6a7c;
  --display: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
  --body: "Manrope", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(240,127,147,.16), transparent 60%),
    radial-gradient(80% 40% at 100% 100%, rgba(242,180,109,.08), transparent 70%),
    var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
}
.wrap { max-width: 620px; margin: 0 auto; padding-inline: 20px; padding-block: 36px 56px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(44px, 11vw, 72px); font-style: italic; letter-spacing: -.01em; }
h2 { font-size: clamp(30px, 7vw, 42px); font-style: italic; }
h3 { font-size: 24px; }
p { margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lead { color: var(--muted); font-size: 17px; max-width: 46ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

.btn {
  border: 0; border-radius: 999px; padding: 15px 28px; font-weight: 700; font-size: 16px;
  background: linear-gradient(100deg, var(--accent), var(--amber)); color: #2a0f1b;
  box-shadow: 0 8px 30px rgba(240,127,147,.25);
  transition: transform .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 12px 22px; font-weight: 600; color: var(--fg); }
.btn-ghost:hover { border-color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* intro */
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 14px; }
.facts b { color: var(--fg); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }

/* quiz */
.progress { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--amber)); transition: width .35s ease; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.counter { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.qtext { font-family: var(--display); font-size: clamp(28px, 6.4vw, 38px); font-weight: 600; line-height: 1.15; text-wrap: balance; min-height: 2.4em; }
.qhint { color: var(--muted); font-size: 15px; }
.opt.multi { align-items: center; }
.opt .box { width: 20px; height: 20px; flex: none; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; }
.opt.multi.on .box { background: var(--accent); border-color: var(--accent); }
.opt.multi.on .box::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--bg); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.star { margin-top: 14px; width: 100%; display: flex; gap: 14px; align-items: center; text-align: left; background: transparent; border: 1px dashed var(--line); border-radius: 14px; padding: 12px 16px; color: var(--muted); font-size: 14px; }
.star .sub { font-size: 12px; }
.star-ic { font-size: 24px; line-height: 1; color: var(--muted); width: 26px; text-align: center; }
.star.on { border-style: solid; border-color: var(--amber); color: var(--fg); }
.star.on .star-ic { color: var(--amber); }
.wish { width: 100%; min-height: 140px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 14px; font: inherit; font-size: 16px; resize: vertical; }
.wish:focus { outline: 2px solid var(--amber); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.chip.star-chip { border-color: var(--amber); }
.callout { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.wheel-wrap { position: relative; width: min(320px, 100%); margin: 0 auto; aspect-ratio: 1; max-width: 100%; }
.wheel-wrap svg { width: 100%; height: 100%; display: block; }
.wheel { transform-origin: 150px 150px; transition: transform 4.2s cubic-bezier(.12,.7,.08,1); }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid var(--amber); filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
.wheel-res { text-align: center; font-family: var(--display); font-style: italic; font-size: 28px; min-height: 1.3em; color: var(--amber); }
.qdef { font-size: 14px; color: var(--muted); background: var(--surface); border-left: 2px solid var(--amber); border-radius: 0 10px 10px 0; padding: 10px 14px; }
.qdef b { color: var(--amber); font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; transition: border-color .15s, background .15s, transform .15s;
}
.opt:hover { border-color: var(--muted); }
.opt.on { border-color: var(--accent); background: var(--surface-2); }
.dots { display: flex; gap: 4px; flex: none; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.f { background: var(--accent); }
.opt .lbl { font-weight: 600; }
.opt .sub { color: var(--muted); font-size: 13px; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pick .opt { flex-direction: column; align-items: flex-start; justify-content: center; min-height: 120px; padding: 18px; }
.pick .opt .lbl { font-family: var(--display); font-size: 24px; font-style: italic; line-height: 1.15; }
.or { text-align: center; font-family: var(--display); font-style: italic; color: var(--muted); font-size: 18px; margin-top: -4px; }
.back { background: none; border: 0; color: var(--muted); padding: 6px 0; font-size: 14px; }
.back:hover { color: var(--fg); }
.back[disabled] { opacity: .35; cursor: default; }
.fade { animation: fade .3s ease both; }
@keyframes fade { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* result */
.hero-card {
  background: linear-gradient(160deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px;
}
.hero-card .arch { font-family: var(--display); font-style: italic; font-size: clamp(40px, 10vw, 58px); line-height: 1; margin-block: 6px 12px;
  background: linear-gradient(100deg, var(--accent), var(--amber)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar { display: grid; grid-template-columns: 9.5em 1fr 3em; gap: 12px; align-items: center; font-size: 15px; }
.bar .track { height: 8px; background: var(--surface-2); border-radius: 8px; overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--accent), var(--amber)); }
.bar .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.axis { display: flex; flex-direction: column; gap: 8px; }
.axis .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.axis .line { position: relative; height: 2px; background: var(--line); margin-block: 10px; }
.axis .line b { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%,-50%);
  background: var(--amber); box-shadow: 0 0 0 6px rgba(242,180,109,.18); }
.ideas { display: flex; flex-direction: column; gap: 12px; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.idea .tag { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); font-weight: 700; }
.idea p { color: var(--muted); font-size: 15px; }
.lists { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.lists > div { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.lists h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.lists ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.lists .yes h4 { color: var(--accent); }
.lists .maybe h4 { color: var(--amber); }
.lists .no h4 { color: var(--no); }
.lists .empty { color: var(--muted); font-style: italic; }
.copied { font-size: 13px; color: var(--amber); }
.sep { height: 1px; background: var(--line); border: 0; margin: 0; }

/* illustrations */
.ill { display: block; overflow: visible; }
.ill use { filter: drop-shadow(0 0 14px rgba(240,127,147,.45)); }
.hero-art { position: relative; height: 190px; display: grid; place-items: center; }
.hero-art .main { position: relative; width: min(260px, 66%); height: auto; animation: breathe 4.5s ease-in-out infinite; }
.hero-art .side { position: absolute; width: min(130px, 34%); height: auto; opacity: .9; }
.hero-art .side-l { left: 0; bottom: 0; transform: rotate(-18deg); }
.hero-art .side-r { right: 0; top: 4px; transform: rotate(14deg); }
.hero-art .glow { position: absolute; inset: 10% 15%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240,127,147,.35), transparent); filter: blur(10px); }
.hero-art .float { position: absolute; width: 22px; height: 22px; opacity: .8; animation: rise 6s ease-in-out infinite; }
.hero-art .f1 { left: 30%; top: 6%; }
.hero-art .f2 { right: 14%; top: 22%; width: 16px; height: 16px; animation-delay: -2s; }
.hero-art .f3 { right: 30%; bottom: 4%; width: 12px; height: 12px; animation-delay: -4s; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes rise { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-14px); opacity: 1; } }
.q-art { width: 84px; height: 60px; }
.arch-art { width: 120px; height: 84px; }
.idea-head { display: flex; align-items: center; gap: 14px; }
.idea-head .ill { width: 44px; height: 34px; flex: none; }
@media (max-width: 560px) {
  .lists { grid-template-columns: 1fr; }
  .bar { grid-template-columns: 7.5em 1fr 2.6em; font-size: 14px; }
  .pick { grid-template-columns: 1fr; }
  .pick .opt { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

// плоский список экранов: шаги всех лесенок, потом дополнительные вопросы
const SCREENS = [];

const app = document.getElementById("app");
let ans = {}, star = {}, idx = -1;

function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function art(id, cls) { return `<svg class="ill ${cls}" viewBox="0 0 120 70" aria-hidden="true"><use href="#i-${id}"/></svg>`; }
const dotColor = v => ({ yes: "var(--accent)", try: "var(--try)", maybe: "var(--maybe)", notyet: "var(--notyet)", no: "var(--nope)" }[v]);

function renderIntro() {
  app.replaceChildren(el(`
    <section class="stack-lg fade">
      <div class="hero-art">
        <div class="glow"></div>
        ${art("collar", "side side-l")}
        ${art("rope", "side side-r")}
        ${art("words", "main")}

      <div class="stack">
        <span class="eyebrow">${NAME}, часть вторая</span>
        <h1>Глубже</h1>
        <p class="lead">Ты уже рассказала многое. Теперь подробнее, по тому, что тебе откликнулось. Каждая тема — лесенка: от самого мягкого к самому смелому. Отмечай каждую ступеньку, и будет видно, с чего начать и до куда ты готова.</p>
      </div>
      <div class="stack">
        <span class="eyebrow">Новые варианты ответа</span>
        <div class="legend">${SC.map(o => `<span class="pill ${o.v}">${o.l}</span>`).join("")}</div>
        <p class="note">«Хочу, но пока не готова» значит «не сейчас, но потом да». А звёздочка ★ осталась: «можешь начинать потихоньку. Если что, я скажу».</p>
      </div>
      <div class="facts"><span><b>${SCREENS.length}</b> вопросов</span><span><b>${TOPICS.length}</b> тем</span><span><b>~10</b> минут</span></div>
      <div class="row"><button class="btn" id="start">Начать</button></div>
    </section>`));
  document.getElementById("start").onclick = () => { idx = 0; renderQ(); };
}

function next() { idx++; idx < SCREENS.length ? renderQ() : renderResult(); window.scrollTo(0, 0); }

function renderQ() {
  const q = SCREENS[idx];
  const cur = ans[q.id];
  const pct = (idx / SCREENS.length) * 100;
  const isStep = !!q.topic;
  const t = q.topic;
  let body;
  if (isStep) {
    const st = star[q.id];
    body = `<div class="opts">${SC.map(o => `
      <button class="opt ${cur === o.v ? "on" : ""}" data-v="${o.v}">
        <span class="dot5" style="background:${dotColor(o.v)}"></span>
        <span><span class="lbl">${o.l}</span><br><span class="sub">${o.s}</span></span>
      </button>`).join("")}</div>
      <button class="star ${st ? "on" : ""}" id="star" aria-pressed="${st ? "true" : "false"}">
        <span class="star-ic">${st ? "★" : "☆"}</span>
        <span>Можешь начинать, потихоньку.<br><span class="sub">Если будет странно или некомфортно, я скажу</span></span>
      </button>`;
  } else if (q.type === "multi") {
    const sel = cur || [];
    body = `<div class="opts">${q.opts.map((o, i) => `
      <button class="opt multi ${sel.includes(o) ? "on" : ""}" data-i="${i}"><span class="box"></span><span class="lbl">${esc(o)}</span></button>`).join("")}</div>
      <div class="row" style="margin-top:18px"><button class="btn" id="go">${idx === SCREENS.length - 1 ? "Показать результат" : "Дальше"}</button></div>`;
  } else {
    body = `<div class="opts">${q.opts.map(o => `
      <button class="opt ${cur === o ? "on" : ""}" data-v="${esc(o)}"><span class="lbl">${esc(o)}</span></button>`).join("")}</div>`;
  }
  const eyebrow = isStep ? `${t.title} · ступенька ${q.i + 1} из ${t.steps.length}` : q.title + (q.type === "multi" ? " · можно несколько" : "");
  app.replaceChildren(el(`
    <section class="stack-lg">
      <div class="stack">
        <div class="qhead">
          <button class="back" id="back">← Назад</button>
          <span class="counter">${idx + 1} / ${SCREENS.length}</span>
        </div>
        <div class="progress"><i style="width:${pct}%"></i></div>
      </div>
      <div class="stack fade">
        ${art(isStep ? t.icon : q.icon, "q-art")}
        <span class="eyebrow">${esc(eyebrow)}</span>
        <p class="qtext">${esc(q.text)}</p>
        ${isStep && q.i === 0 && t.intro ? `<p class="qhint">${esc(t.intro)}</p>` : ""}
        ${isStep && q.i === 0 && t.def ? `<p class="qdef"><b>Важно:</b> ${esc(t.def)}</p>` : ""}
      </div>
      <div class="fade">${body}</div>
    </section>`));
  document.getElementById("back").onclick = () => { if (idx === 0) { idx = -1; renderIntro(); } else { idx--; renderQ(); } };

  if (q.type === "multi") {
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const o = q.opts[b.dataset.i], sel = new Set(ans[q.id] || []);
      sel.has(o) ? sel.delete(o) : sel.add(o);
      ans[q.id] = [...sel];
      b.classList.toggle("on", sel.has(o));
    });
    document.getElementById("go").onclick = next;
    return;
  }
  const s = document.getElementById("star");
  if (s) s.onclick = () => {
    star[q.id] = !star[q.id];
    s.classList.toggle("on", star[q.id]);
    s.setAttribute("aria-pressed", star[q.id] ? "true" : "false");
    s.querySelector(".star-ic").textContent = star[q.id] ? "★" : "☆";
  };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    ans[q.id] = b.dataset.v;
    app.querySelectorAll(".opt").forEach(x => x.classList.toggle("on", x === b));
    setTimeout(next, 220);
  });
}

function renderResult(shared) {
  const stepAns = (t, i) => ans[`${t.id}.${i}`];
  const topicCard = t => {
    const go = t.steps.map((s, i) => ({ s, i, v: stepAns(t, i) }));
    const ok = go.filter(x => x.v === "yes" || x.v === "try");
    const first = ok[0], far = ok[ok.length - 1];
    const later = go.filter(x => x.v === "notyet");
    return `<div class="stack">
      <div class="topic-head">${art(t.icon, "")}<div><h3>${t.title}</h3>
        <span class="step-of">готова на ${ok.length} из ${t.steps.length} ступенек</span></div></div>
      <div class="ladder">${go.map(x => `
        <div class="rung"><span class="n">${x.i + 1}</span><span class="t">${esc(x.s)}${star[`${t.id}.${x.i}`] ? `<span class="st">★</span>` : ""}</span>
        ${x.v ? `<span class="pill ${x.v}">${SHORT[x.v]}</span>` : `<span></span>`}</div>`).join("")}
      </div>
      ${first ? `<p class="first"><b>Начнём с:</b> ${esc(first.s.toLowerCase())}${far && far !== first ? `. <b>Самое смелое сейчас:</b> ${esc(far.s.toLowerCase())}` : ""}.</p>` : ""}
      ${later.length ? `<p class="first" style="border-color:var(--notyet)"><b style="color:var(--notyet)">На потом:</b> ${later.map(x => esc(x.s.toLowerCase())).join("; ")}.</p>` : ""}
    </div>`;
  };
  const all = TOPICS.flatMap(t => t.steps.map((s, i) => ({ s, t, v: stepAns(t, i), st: star[`${t.id}.${i}`] })));
  const group = v => all.filter(x => x.v === v).map(x => `${x.t.title}: ${x.s.toLowerCase()}`);
  const starred = all.filter(x => x.st && x.v !== "no").map(x => `${x.t.title}: ${x.s.toLowerCase()}`);
  const li = arr => arr.length ? arr.map(x => `<li>${esc(x)}</li>`).join("") : `<li class="empty">пусто</li>`;
  const chips = arr => `<div class="chips">${(arr || []).map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>`;
  const G = [["yes", "Очень хочу"], ["try", "Попробуем"], ["maybe", "Возможно, это круто"], ["notyet", "Пока не готова"], ["no", "Нет"]];

  // смена ролей — отдельным акцентом
  const roles = TOPICS.find(t => t.id === "roles");
  const rolesGo = roles.steps.map((s, i) => ({ s, v: stepAns(roles, i), st: star[`roles.${i}`] }));
  const rolesWant = rolesGo.filter(x => x.v === "yes" || x.v === "try");
  const rolesLater = rolesGo.filter(x => x.v === "maybe" || x.v === "notyet");
  const showRoles = rolesWant.length || rolesLater.length || ans.rolesWho || ans.rolesWhat?.length;

  // страницы результата: каждая становится отдельной картинкой
  const topicsNoRoles = TOPICS.filter(t => t.id !== "roles");
  const topicPages = [];
  for (let i = 0; i < topicsNoRoles.length; i += 3) topicPages.push(topicsNoRoles.slice(i, i + 3));

  app.replaceChildren(el(`
    <section class="stack-lg fade">
      <div class="page stack-lg">
        <div class="hero-card stack">
          ${art("crown", "arch-art")}
          <span class="eyebrow">${shared ? `Результат: ${NAME}` : `${NAME}, твоя карта глубже`}</span>
          <div class="arch">Лесенки</div>
          <p>По каждой теме видно, с чего начать и докуда ${shared ? "она готова" : "ты готова"} сейчас. «Пока не готова» — это на потом, без спешки.</p>
          <div class="legend">${SC.map(o => `<span class="pill ${o.v}">${o.l}</span>`).join("")}</div>
        </div>

        ${showRoles ? `<div class="callout roles">
          ${art("crown", "q-art")}
          <span class="eyebrow">Смена ролей</span>
          <h2>${shared ? "Когда ведёт она" : "Когда ведёшь ты"}</h2>
          ${ans.rolesWho ? `<p class="who"><span>Кто начинает</span><b>${esc(ans.rolesWho)}</b></p>` : ""}
          ${rolesWant.length ? `<p class="lead" style="font-size:15px">Что хочется:</p>
          <div class="chips">${rolesWant.map(x => `<span class="chip">${x.st ? "★ " : ""}${esc(x.s)}</span>`).join("")}</div>` : ""}
          ${ans.rolesWhat?.length ? `<p class="lead" style="font-size:15px">Что важнее всего:</p>${chips(ans.rolesWhat)}` : ""}
          ${rolesLater.length ? `<p class="first" style="border-color:var(--maybe)"><b style="color:var(--maybe)">Возможно, потом:</b> ${rolesLater.map(x => esc(x.s.toLowerCase())).join("; ")}.</p>` : ""}
        </div>` : ""}

        ${starred.length ? `<div class="callout">
          <span class="eyebrow">★ Можешь начинать, потихоньку</span>
          <h3>Если будет некомфортно, я скажу</h3>
          <div class="chips">${starred.map(x => `<span class="chip star-chip">★ ${esc(x)}</span>`).join("")}</div>
        </div>` : ""}
      </div>

      ${topicPages.map(pg => `<div class="page stack-lg">${pg.map(topicCard).join('<hr class="sep">')}</div>`).join("")}

      <div class="page stack-lg">
        ${topicCard(roles)}
        ${ans.words?.length ? `<div class="stack"><h3>Что хочется слышать на ушко</h3>${chips(ans.words)}</div>` : ""}
        ${ans.look?.length ? `<div class="stack"><h3>Образ для вечера</h3>${chips(ans.look)}</div>` : ""}
        ${ans.afterWords?.length || ans.afterTalk ? `<div class="callout">
          <span class="eyebrow">После</span>
          ${ans.afterWords?.length ? `<p class="lead" style="font-size:15px">Что сказать после:</p>${chips(ans.afterWords)}` : ""}
          ${ans.afterTalk ? `<p class="lead" style="font-size:15px">Обсудить, как было: <b style="color:var(--fg)">${esc(ans.afterTalk.toLowerCase())}</b></p>` : ""}
        </div>` : ""}
      </div>

      <div class="page stack">
        <h3>Всё вместе</h3>
        <div class="groups">${G.map(([v, h]) => `<div class="g-${v}"><h4>${h}</h4><ul>${li(group(v))}</ul></div>`).join("")}</div>
      </div>

      <div class="callout">
        <span class="eyebrow">${shared ? "Сохранить" : "Отправить мне"}</span>
        <h3>${shared ? "Картинки и ссылка" : "Пришли результат картинками или ссылкой"}</h3>
        <div class="row">
          <button class="btn" id="imgs">Сделать картинки</button>
          <button class="btn-ghost" id="link">Скопировать ссылку</button>
          ${shared ? "" : `<button class="btn-ghost" id="copy">Скопировать текстом</button>`}
        </div>
        <span class="copied" id="copied" hidden></span>
        <input id="linkField" class="wish" style="min-height:0" readonly hidden>
        <div id="gallery" class="gallery" hidden></div>
      </div>
      ${shared ? `<div class="row"><a class="btn-ghost" href="deep.html" style="text-decoration:none">Пройти тест</a></div>` :
      `<div class="row"><button class="btn-ghost" id="again">Пройти заново</button></div>`}
      <p class="note">Ничего не нужно делать сразу. Начинаем с первых ступенек, а светофор работает всегда: «жёлтый» — помедленнее, «красный» — стоп.</p>
      <textarea id="copytext" readonly hidden style="width:100%;min-height:160px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:14px"></textarea>
    </section>`));

  const text = [
    "Мой результат «Карта желаний. Глубже»",
    ans.rolesWho ? `Смена ролей, кто начинает: ${ans.rolesWho}` : "",
    ans.rolesWhat?.length ? `Когда веду я, важно: ${ans.rolesWhat.join(", ")}` : "",
    ...TOPICS.map(t => `${t.title}: ` + t.steps.map((s, i) => `${i + 1}) ${s.toLowerCase()} — ${SHORT[stepAns(t, i)] || "—"}${star[`${t.id}.${i}`] ? " ★" : ""}`).join("; ")),
    starred.length ? `★ Можешь начинать, потихоньку: ${starred.join("; ")}` : "",
    ans.words?.length ? `На ушко: ${ans.words.join(", ")}` : "",
    ans.look?.length ? `Образ: ${ans.look.join(", ")}` : "",
    ans.afterWords?.length ? `После сказать: ${ans.afterWords.join(", ")}` : "",
    ans.afterTalk ? `Обсудить, как было: ${ans.afterTalk}` : ""
  ].filter(Boolean).join("\n");

  const msg = document.getElementById("copied");
  const say = t => { msg.textContent = t; msg.hidden = false; };
  const copyBtn = document.getElementById("copy");
  if (copyBtn) copyBtn.onclick = async () => {
    try { await navigator.clipboard.writeText(text); say("Текст скопирован, можно отправлять"); }
    catch (e) {
      const ta = document.getElementById("copytext");
      ta.value = text; ta.hidden = false; ta.focus(); ta.select();
      say("Выдели текст ниже и скопируй");
    }
  };
  document.getElementById("link").onclick = async () => {
    const url = location.href.split("#")[0] + "#r=" + encodeState();
    const f = document.getElementById("linkField");
    f.value = url; f.hidden = false;
    try { await navigator.clipboard.writeText(url); say("Ссылка скопирована. По ней откроется этот результат"); }
    catch (e) { f.focus(); f.select(); say("Скопируй ссылку из поля ниже"); }
  };
  document.getElementById("imgs").onclick = () => makeImages(say);
  const again = document.getElementById("again");
  if (again) again.onclick = () => { ans = {}; star = {}; idx = -1; history.replaceState(null, "", location.pathname); renderIntro(); window.scrollTo(0, 0); };
  window.scrollTo(0, 0);
}

// ---------- ссылка на результат: ответы зашиты в адрес после # ----------
const CODE = { yes: "y", try: "t", maybe: "m", notyet: "n", no: "x" };
const DECODE = Object.fromEntries(Object.entries(CODE).map(([k, v]) => [v, k]));
function encodeState() {
  const steps = SCREENS.filter(q => q.topic);
  const st = {
    v: steps.map(q => CODE[ans[q.id]] || "_").join(""),
    s: steps.map(q => star[q.id] ? 1 : 0).join(""),
    e: Object.fromEntries(EXTRA.map(q => [q.id, q.type === "multi" ? (ans[q.id] || []).map(o => q.opts.indexOf(o)) : q.opts.indexOf(ans[q.id])]))
  };
  const bytes = new TextEncoder().encode(JSON.stringify(st));
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeState(code) {
  const bin = atob(code.replace(/-/g, "+").replace(/_/g, "/"));
  const st = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  const steps = SCREENS.filter(q => q.topic);
  ans = {}; star = {};
  steps.forEach((q, i) => { const v = DECODE[st.v[i]]; if (v) ans[q.id] = v; if (st.s[i] === "1") star[q.id] = true; });
  EXTRA.forEach(q => {
    const e = st.e?.[q.id];
    if (q.type === "multi" && Array.isArray(e)) ans[q.id] = e.map(i => q.opts[i]).filter(Boolean);
    else if (typeof e === "number" && e >= 0) ans[q.id] = q.opts[e];
  });
}

// ---------- картинки ----------
function inlineSvgs(root) {
  const grads = ["hot", "flame"].map(id => document.getElementById(id)?.outerHTML || "").join("");
  root.querySelectorAll("svg.ill use").forEach(u => {
    const sym = document.querySelector(u.getAttribute("href"));
    const svg = u.closest("svg");
    if (!sym || !svg) return;
    svg.innerHTML = `<defs>${grads}</defs>` + sym.innerHTML;
    svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  });
}

async function makeImages(say) {
  const btn = document.getElementById("imgs"), gal = document.getElementById("gallery");
  if (!window.html2canvas) { say("Не получилось загрузить генератор картинок. Проверь интернет и попробуй ещё раз"); return; }
  btn.disabled = true; say("Рисую картинки…");
  const pages = [...document.querySelectorAll(".page")];
  inlineSvgs(document.getElementById("app"));
  document.documentElement.classList.add("capture");
  const bg = getComputedStyle(document.body).backgroundColor;
  const files = [];
  try {
    for (let i = 0; i < pages.length; i++) {
      const canvas = await html2canvas(pages[i], { backgroundColor: bg, scale: 2, useCORS: true, logging: false });
      const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
      files.push(new File([blob], `dara-${i + 1}.png`, { type: "image/png" }));
    }
  } catch (e) {
    say("Не получилось сделать картинки: " + e.message);
    btn.disabled = false; document.documentElement.classList.remove("capture"); return;
  }
  document.documentElement.classList.remove("capture");
  btn.disabled = false;
  gal.replaceChildren(el(files.map((f, i) => `<a href="${URL.createObjectURL(f)}" download="${f.name}"><img src="${URL.createObjectURL(f)}" alt="Картинка ${i + 1}"></a>`).join("")));
  gal.hidden = false;
  if (navigator.canShare && navigator.canShare({ files })) {
    say(`Готово: ${files.length} картинок. Нажми «Отправить», чтобы переслать их`);
    const share = document.createElement("button");
    share.className = "btn"; share.textContent = "Отправить картинки";
    share.onclick = () => navigator.share({ files, title: "Карта желаний. Глубже" }).catch(() => {});
    gal.before(share);
  } else {
    say(`Готово: ${files.length} картинок. Нажми на картинку, чтобы скачать, или зажми и сохрани`);
  }
}

if (location.hash.startsWith("#r=")) {
  try { decodeState(location.hash.slice(3)); renderResult(true); }
  catch (e) { renderIntro(); }
} else {
  renderIntro();
}
</script>
