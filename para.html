<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Мы вдвоём</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow candle-lit column; one question at a time, result reads like a personal card. */
:root {
  --bg: #170d14;
  --surface: #23141e;
  --surface-2: #2e1a27;
  --line: #43293a;
  --fg: #f4e7ec;
  --muted: #b596a6;
  --accent: #f07f93;
  --amber: #f2b46d;
  --no: #8c6a7c;
  --display: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
  --body: "Manrope", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(240,127,147,.16), transparent 60%),
    radial-gradient(80% 40% at 100% 100%, rgba(242,180,109,.08), transparent 70%),
    var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
}
.wrap { max-width: 620px; margin: 0 auto; padding-inline: 20px; padding-block: 36px 56px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(44px, 11vw, 72px); font-style: italic; letter-spacing: -.01em; }
h2 { font-size: clamp(30px, 7vw, 42px); font-style: italic; }
h3 { font-size: 24px; }
p { margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lead { color: var(--muted); font-size: 17px; max-width: 46ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

.btn {
  border: 0; border-radius: 999px; padding: 15px 28px; font-weight: 700; font-size: 16px;
  background: linear-gradient(100deg, var(--accent), var(--amber)); color: #2a0f1b;
  box-shadow: 0 8px 30px rgba(240,127,147,.25);
  transition: transform .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn-ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 12px 22px; font-weight: 600; color: var(--fg); }
.btn-ghost:hover { border-color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* intro */
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 14px; }
.facts b { color: var(--fg); font-weight: 600; }
.note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 12px; }

/* quiz */
.progress { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--amber)); transition: width .35s ease; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.counter { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.qtext { font-family: var(--display); font-size: clamp(28px, 6.4vw, 38px); font-weight: 600; line-height: 1.15; text-wrap: balance; min-height: 2.4em; }
.qhint { color: var(--muted); font-size: 15px; }
.opt.multi { align-items: center; }
.opt .box { width: 20px; height: 20px; flex: none; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; }
.opt.multi.on .box { background: var(--accent); border-color: var(--accent); }
.opt.multi.on .box::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--bg); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.star { margin-top: 14px; width: 100%; display: flex; gap: 14px; align-items: center; text-align: left; background: transparent; border: 1px dashed var(--line); border-radius: 14px; padding: 12px 16px; color: var(--muted); font-size: 14px; }
.star .sub { font-size: 12px; }
.star-ic { font-size: 24px; line-height: 1; color: var(--muted); width: 26px; text-align: center; }
.star.on { border-style: solid; border-color: var(--amber); color: var(--fg); }
.star.on .star-ic { color: var(--amber); }
.wish { width: 100%; min-height: 140px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 14px; font: inherit; font-size: 16px; resize: vertical; }
.wish:focus { outline: 2px solid var(--amber); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.chip.star-chip { border-color: var(--amber); }
.callout { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.wheel-wrap { position: relative; width: min(320px, 100%); margin: 0 auto; aspect-ratio: 1; max-width: 100%; }
.wheel-wrap svg { width: 100%; height: 100%; display: block; }
.wheel { transform-origin: 150px 150px; transition: transform 4.2s cubic-bezier(.12,.7,.08,1); }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid var(--amber); filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
.wheel-res { text-align: center; font-family: var(--display); font-style: italic; font-size: 28px; min-height: 1.3em; color: var(--amber); }
.qdef { font-size: 14px; color: var(--muted); background: var(--surface); border-left: 2px solid var(--amber); border-radius: 0 10px 10px 0; padding: 10px 14px; }
.qdef b { color: var(--amber); font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; transition: border-color .15s, background .15s, transform .15s;
}
.opt:hover { border-color: var(--muted); }
.opt.on { border-color: var(--accent); background: var(--surface-2); }
.dots { display: flex; gap: 4px; flex: none; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.f { background: var(--accent); }
.opt .lbl { font-weight: 600; }
.opt .sub { color: var(--muted); font-size: 13px; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pick .opt { flex-direction: column; align-items: flex-start; justify-content: center; min-height: 120px; padding: 18px; }
.pick .opt .lbl { font-family: var(--display); font-size: 24px; font-style: italic; line-height: 1.15; }
.or { text-align: center; font-family: var(--display); font-style: italic; color: var(--muted); font-size: 18px; margin-top: -4px; }
.back { background: none; border: 0; color: var(--muted); padding: 6px 0; font-size: 14px; }
.back:hover { color: var(--fg); }
.back[disabled] { opacity: .35; cursor: default; }
.fade { animation: fade .3s ease both; }
@keyframes fade { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* result */
.hero-card {
  background: linear-gradient(160deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px;
}
.hero-card .arch { font-family: var(--display); font-style: italic; font-size: clamp(40px, 10vw, 58px); line-height: 1; margin-block: 6px 12px;
  background: linear-gradient(100deg, var(--accent), var(--amber)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar { display: grid; grid-template-columns: 9.5em 1fr 3em; gap: 12px; align-items: center; font-size: 15px; }
.bar .track { height: 8px; background: var(--surface-2); border-radius: 8px; overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--accent), var(--amber)); }
.bar .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.axis { display: flex; flex-direction: column; gap: 8px; }
.axis .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.axis .line { position: relative; height: 2px; background: var(--line); margin-block: 10px; }
.axis .line b { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; transform: translate(-50%,-50%);
  background: var(--amber); box-shadow: 0 0 0 6px rgba(242,180,109,.18); }
.ideas { display: flex; flex-direction: column; gap: 12px; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.idea .tag { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); font-weight: 700; }
.idea p { color: var(--muted); font-size: 15px; }
.lists { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.lists > div { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.lists h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.lists ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.lists .yes h4 { color: var(--accent); }
.lists .maybe h4 { color: var(--amber); }
.lists .no h4 { color: var(--no); }
.lists .empty { color: var(--muted); font-style: italic; }
.copied { font-size: 13px; color: var(--amber); }
.sep { height: 1px; background: var(--line); border: 0; margin: 0; }

/* illustrations */
.ill { display: block; overflow: visible; }
.ill use { filter: drop-shadow(0 0 14px rgba(240,127,147,.45)); }
.hero-art { position: relative; height: 190px; display: grid; place-items: center; }
.hero-art .main { position: relative; width: min(260px, 66%); height: auto; animation: breathe 4.5s ease-in-out infinite; }
.hero-art .side { position: absolute; width: min(130px, 34%); height: auto; opacity: .9; }
.hero-art .side-l { left: 0; bottom: 0; transform: rotate(-18deg); }
.hero-art .side-r { right: 0; top: 4px; transform: rotate(14deg); }
.hero-art .glow { position: absolute; inset: 10% 15%; border-radius: 50%; background: radial-gradient(closest-side, rgba(240,127,147,.35), transparent); filter: blur(10px); }
.hero-art .float { position: absolute; width: 22px; height: 22px; opacity: .8; animation: rise 6s ease-in-out infinite; }
.hero-art .f1 { left: 30%; top: 6%; }
.hero-art .f2 { right: 14%; top: 22%; width: 16px; height: 16px; animation-delay: -2s; }
.hero-art .f3 { right: 30%; bottom: 4%; width: 12px; height: 12px; animation-delay: -4s; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes rise { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-14px); opacity: 1; } }
.q-art { width: 84px; height: 60px; }
.arch-art { width: 120px; height: 84px; }
.idea-head { display: flex; align-items: center; gap: 14px; }
.idea-head .ill { width: 44px; height: 34px; flex: none; }
@media (max-width: 560px) {
  .lists { grid-template-columns: 1fr; }
  .bar { grid-template-columns: 7.5em 1fr 2.6em; font-size: 14px; }
  .pick { grid-template-columns: 1fr; }
  .pick .opt { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

function dec(c) { const bin = atob(c.replace(/-/g, "+").replace(/_/g, "/")); return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)))); }

      <div class="callout">

        <h3>${shared ? "Вставь свою ссылку, чтобы увидеть совпадения" : "Отправь ссылку партнёру и вставь его ссылку ниже"}</h3>
        ${shared ? "" : `<div class="row"><button class="btn" id="link">Скопировать мою ссылку</button><button class="btn-ghost" id="imgs">Сделать картинки</button></div>
        <input id="linkField" class="cmp-input" readonly hidden>`}
        <span class="copied" id="msg" hidden></span>
        <div id="gallery" class="gallery" hidden></div>
        <input id="other" class="cmp-input" placeholder="${shared ? "Вставь сюда свою ссылку" : "Вставь сюда ссылку партнёра"}">
        <div class="row"><button class="btn" id="cmp">Сравнить</button></div>
      </div>
      <p class="note">По твоей ссылке партнёр не увидит твоих ответов, только сравнение: где вы совпали, и ваши ответы в открытых вопросах.</p>
      ${shared ? `<div class="row"><a class="btn-ghost" href="${location.pathname}" style="text-decoration:none">Пройти тест</a></div>` : `<div class="row"><button class="btn-ghost" id="again">Пройти заново</button></div>`}
    </section>`));
  const say = t => { const m = document.getElementById("msg"); m.textContent = t; m.hidden = false; };
  const mine = { r: role, a: ans, s: Object.keys(star) };
  const lb = document.getElementById("link");
  if (lb) lb.onclick = async () => {
    const url = myLink(), f = document.getElementById("linkField"); f.value = url; f.hidden = false;
    try { await navigator.clipboard.writeText(url); say("Ссылка скопирована, отправь её партнёру"); } catch (e) { f.focus(); f.select(); say("Скопируй ссылку из поля"); }
  };
  const ib = document.getElementById("imgs"); if (ib) ib.onclick = () => makeImages(say, "moi-otvety");
  document.getElementById("cmp").onclick = () => {
    const other = parseLink(document.getElementById("other").value);
    if (!other) { say("Это не похоже на ссылку из теста. Скопируй её целиком, вместе с #r="); return; }
    renderCompare(mine, other);
  };
  const ag = document.getElementById("again"); if (ag) ag.onclick = () => { ans = {}; star = {}; role = null; idx = -1; history.replaceState(null, "", location.pathname); renderIntro(); };
  window.scrollTo(0, 0);
}

function renderShared(other) {
  app.replaceChildren(el(`
    <section class="stack-lg fade">
      <div class="hero-card stack">
        ${art("words", "arch-art")}
        <span class="eyebrow">Партнёр прошёл тест</span>
        <div class="arch">Мы вдвоём</div>
        <p>Ответы партнёра здесь не показываются. Видно будет только сравнение: где вы совпали.</p>
      </div>
      <div class="callout">
        <h3>Уже прошёл тест? Вставь свою ссылку</h3>
        <input id="other" class="cmp-input" placeholder="Вставь сюда свою ссылку">
        <div class="row"><button class="btn" id="cmp">Сравнить</button></div>
        <span class="copied" id="msg" hidden></span>
      </div>
      <div class="stack"><h3>Ещё не проходил?</h3>
        <p class="note">Пройди тест, в конце скопируй свою ссылку и вставь её сюда или отправь партнёру.</p>
        <div class="row"><a class="btn-ghost" href="${location.pathname}" style="text-decoration:none">Пройти тест</a></div></div>
    </section>`));
  document.getElementById("cmp").onclick = () => {
    const mine = parseLink(document.getElementById("other").value);
    if (!mine) { const m = document.getElementById("msg"); m.textContent = "Это не похоже на ссылку из теста. Скопируй её целиком, вместе с #r="; m.hidden = false; return; }
    renderCompare(mine, other, () => renderShared(other));
  };
}

// ---------- сравнение ----------
function renderCompare(x, y, onBack) {
  let A = x, B = y;
  if (x.r === "m" && y.r === "f") { A = y; B = x; }
  const pair = A.r === "f" && B.r === "m";
  const la = pair ? "Она" : "Первый", lb = pair ? "Он" : "Второй";
  const DAT = { "Она": "Ей", "Он": "Ему", "Первый": "Первому", "Второй": "Второму" };
  const SA = summary(A), SB = summary(B);
  // пары «дать / получить»: её «дать» сравниваем с его «получить»
  const CROSS = { oralGet: "oralGive", oralGive: "oralGet", masturbShow: "masturbWatch", masturbWatch: "masturbShow" };
  const CROSS_NAME = pair ? { oralGet: "Оральные ласки ей", oralGive: "Оральные ласки ему", masturbShow: "Она ласкает себя при нём", masturbWatch: "Он ласкает себя при ней" }
                          : { oralGet: `Оральные ласки: ${la.toLowerCase()} получает`, oralGive: `Оральные ласки: ${lb.toLowerCase()} получает`, masturbShow: `${la} ласкает себя`, masturbWatch: `${lb} ласкает себя` };
  const bid = id => CROSS[id] || id;
  const sa = new Set(A.s || []), sb = new Set(B.s || []);
  const P = q => ({ a: A.a[q.id], b: B.a[bid(q.id)], sa: sa.has(q.id), sb: sb.has(bid(q.id)) });
  const va = id => A.a[id], vb = id => B.a[id];
  const answered = q => P(q).a !== undefined && P(q).b !== undefined;
  const name = q => CROSS_NAME[q.id] || q.short;
  const bothVery = SCALEQ.filter(q => answered(q) && P(q).a === 4 && P(q).b === 4);
  const both = SCALEQ.filter(q => answered(q) && P(q).a >= 3 && P(q).b >= 3 && !(P(q).a === 4 && P(q).b === 4));
  const talk = SCALEQ.filter(q => answered(q) && ((P(q).a >= 3 && P(q).b === 2) || (P(q).b >= 3 && P(q).a === 2)));
  const bothNo = SCALEQ.filter(q => answered(q) && P(q).a <= 1 && P(q).b <= 1);
  const hidden = SCALEQ.filter(q => answered(q) && ((P(q).a >= 3 && P(q).b <= 1) || (P(q).b >= 3 && P(q).a <= 1))).length;
  const shyBoth = SCALEQ.filter(q => answered(q) && P(q).sa && P(q).sb && P(q).a >= 2 && P(q).b >= 2);
  const shyOne = SCALEQ.filter(q => answered(q) && (P(q).sa || P(q).sb) && !(P(q).sa && P(q).sb) && P(q).a >= 3 && P(q).b >= 3);
  const bySec = list => { const m = new Map(); list.forEach(q => { const k = q.sec.replace(/:.*$/, ""); if (!m.has(k)) m.set(k, []); m.get(k).push(name(q)); }); return m; };
  const secBlocks = list => [...bySec(list)].map(([k, v]) => `<div class="stack" style="gap:6px"><span class="step-of">${esc(k)}</span>${chips(v)}</div>`).join("");
  const row = (title, a, b) => `<div class="stack" style="gap:6px"><span class="eyebrow">${title}</span>
    <div class="vs"><div><span class="who">${la}</span>${esc(a)}</div><div class="b"><span class="who">${lb}</span>${esc(b)}</div></div>
    ${a === b && a !== "—" ? `<span class="same">Совпало</span>` : ""}</div>`;
  const inter = id => { const st = new Set(A.a[id] || []); return withRole("f", () => (B.a[id] || []).filter(i => st.has(i)).map(i => optText(QQ(id), i))); };
  const absNow = (i, me, oth) => i === undefined ? "—" : ["Чаще " + me.toLowerCase(), "Чаще " + oth.toLowerCase(), "Поровну"][i];
  const starts = who => (who === "Она" ? "Чтобы чаще начинала " : "Чтобы чаще начинал ") + who.toLowerCase();
  const absWant = (i, me, oth) => i === undefined ? "—" : [starts(me), starts(oth), "Поровну", "Без разницы"][i];
  const wantGap = (A.a.want ?? 9) - (B.a.want ?? 9);
  const picksSame = Q.filter(q => q.type === "pick" && va(q.id) !== undefined && va(q.id) === vb(q.id)).map(q => withRole(A.r, () => optText(q, va(q.id))));
  const domA = A.a.domRole, domB = B.a.domRole;
  const domFit = domA === undefined || domB === undefined ? "" :
    (domA === 0 && domB === 1) || (domA === 1 && domB === 0) ? "Идеально дополняете друг друга: один ведёт, другой подчиняется." :
    domA === 2 || domB === 2 ? "Можно по очереди: кто-то из вас готов в обе роли." :
    domA === domB && domA < 2 ? "Оба хотите одну и ту же роль. Стоит договориться, кто когда." : "Кто-то пока не знает. Можно начать с лёгкого и посмотреть.";
  const analA = A.a.analExp, analB = B.a.analExp;

  app.replaceChildren(el(`
    <section class="stack-lg fade">
      <div class="page stack-lg">
        <div class="hero-card stack">
          ${art("words", "arch-art")}
          <span class="eyebrow">Сравнение</span>
          <div class="arch">Где вы совпали</div>
          <p>«Оба очень хотят»: <b>${bothVery.length}</b>. «Оба за»: <b>${bothVery.length + both.length}</b>.</p>
          ${SA.rate && SB.rate ? `<div class="vs"><div><span class="who">${la}</span><span class="score">${SA.rate}</span>/10</div><div class="b"><span class="who">${lb}</span><span class="score" style="color:var(--him)">${SB.rate}</span>/10</div></div>` : ""}
        </div>
        ${row("Как часто хочется", SA.want, SB.want)}
        ${wantGap !== 0 && Math.abs(wantGap) < 9 ? `<p class="first"><b>Разница в желании.</b> ${DAT[wantGap > 0 ? lb : la]} хочется чаще. Это нормально, главное — найти ритм, который подходит обоим.</p>` : ""}
        ${row("Как часто получается", SA.real, SB.real)}
        ${row("По времени", SA.long, SB.long)}
        ${row("Прелюдия", SA.fore, SB.fore)}
        ${inter("when").length ? `<div class="stack"><span class="eyebrow">Обоим хочется в это время</span>${chips(inter("when"))}</div>` : ""}
      </div>
      <div class="page stack-lg">
        ${row("Кто чаще начинает сейчас (по мнению каждого)", absNow(va("initNow"), la, lb), absNow(vb("initNow"), lb, la))}
        ${row("Как хотелось бы", absWant(va("initWant"), la, lb), absWant(vb("initWant"), lb, la))}
        ${inter("initHow").length ? `<div class="stack"><span class="eyebrow">Обоим нравится, когда начинают</span>${chips(inter("initHow"))}</div>` : ""}
        ${row("Как проще сказать «не сегодня»", SA.noHow, SB.noHow)}
        ${row("Когда отказали", SA.noFeel, SB.noFeel)}
        ${row("Говорить о сексе", SA.talkEase, SB.talkEase)}
        ${row("Оргазм бывает", SA.orgFreq, SB.orgFreq)}
        ${inter("orgHelp").length ? `<div class="stack"><span class="eyebrow">Обоим помогает кончить</span>${chips(inter("orgHelp"))}</div>` : ""}
        ${inter("poses").length ? `<div class="stack"><span class="eyebrow">Общие любимые позы</span>${chips(inter("poses"))}</div>` : ""}
        ${picksSame.length ? `<div class="stack"><span class="eyebrow">Одинаково выбрали</span>${chips(picksSame)}</div>` : ""}
      </div>
      <div class="page stack-lg">
        <div class="callout"><span class="eyebrow">Оба очень хотят</span><h3>Это точно стоит попробовать</h3>${bothVery.length ? secBlocks(bothVery) : `<p class="note">пусто</p>`}</div>
        ${shyBoth.length ? `<div class="callout"><span class="eyebrow">★ Вот это поворот</span><h3>Оба хотите и оба стеснялись предложить</h3>${chips(shyBoth.map(name), "star-chip")}</div>` : ""}
        ${shyOne.length ? `<div class="callout"><span class="eyebrow">★ Можно смело</span><h3>Один стеснялся, а второй тоже за</h3>${chips(shyOne.map(name), "star-chip")}</div>` : ""}
        <div class="stack"><span class="eyebrow">Оба за</span>${both.length ? secBlocks(both) : `<p class="note">пусто</p>`}</div>
      </div>
      <div class="page stack-lg">
        ${domFit ? `<div class="callout roles">${art("crown", "q-art")}<span class="eyebrow">Власть</span>
          <div class="vs"><div><span class="who">${la}</span>${esc(SA.domRole)}</div><div class="b"><span class="who">${lb}</span>${esc(SB.domRole)}</div></div><p class="first">${domFit}</p></div>` : ""}
        ${analA !== undefined && analB !== undefined ? row("Анал: опыт", SA.analExp, SB.analExp) : ""}
        ${talk.length ? `<div class="stack"><span class="eyebrow">Можно обсудить</span><p class="note">Одному хочется, второй пока не знает</p>${chips(talk.map(name))}</div>` : ""}
        ${bothNo.length ? `<div class="stack"><span class="eyebrow">Обоим не надо</span>${chips(bothNo.map(name))}</div>` : ""}
        ${hidden ? `<p class="note">Ещё ${hidden} пункт(ов) не совпали: одному хочется, второму нет. Их не показываем, чтобы никому не было неловко.</p>` : ""}
        ${(SA.skipped.length || SB.skipped.length) ? `<p class="note">Пропущенные блоки: ${la.toLowerCase()} — ${SA.skipped.join(", ") || "нет"}, ${lb.toLowerCase()} — ${SB.skipped.join(", ") || "нет"}. Там сравнивать нечего.</p>` : ""}
        ${inter("after").length ? `<div class="stack"><span class="eyebrow">После обоим нравится</span>${chips(inter("after"))}</div>` : ""}
        ${SA.best || SB.best ? `<div class="callout"><span class="eyebrow">Больше всего нравится</span>${SA.best ? `<p><b>${la}:</b> «${esc(SA.best)}»</p>` : ""}${SB.best ? `<p><b>${lb}:</b> «${esc(SB.best)}»</p>` : ""}</div>` : ""}
        ${SA.more || SB.more ? `<div class="callout"><span class="eyebrow">Хотелось бы больше</span>${SA.more ? `<p><b>${la}:</b> «${esc(SA.more)}»</p>` : ""}${SB.more ? `<p><b>${lb}:</b> «${esc(SB.more)}»</p>` : ""}</div>` : ""}
        ${SA.secret || SB.secret ? `<div class="callout"><span class="eyebrow">Фантазии</span>${SA.secret ? `<p><b>${la}:</b> «${esc(SA.secret)}»</p>` : ""}${SB.secret ? `<p><b>${lb}:</b> «${esc(SB.secret)}»</p>` : ""}</div>` : ""}
      </div>
      <div class="callout">
        <div class="row"><button class="btn" id="imgs">Сделать картинки</button><button class="btn-ghost" id="backRes">Назад</button></div>
        <span class="copied" id="msg" hidden></span>
        <div id="gallery" class="gallery" hidden></div>
      </div>
    </section>`));
  const say = t => { const m = document.getElementById("msg"); m.textContent = t; m.hidden = false; };
  document.getElementById("imgs").onclick = () => makeImages(say, "sravnenie");
  document.getElementById("backRes").onclick = onBack || (() => { role = x.r; ans = x.a; star = Object.fromEntries((x.s || []).map(k => [k, true])); renderResult(); });
  window.scrollTo(0, 0);
}

// ---------- картинки ----------
function inlineSvgs(root) {
  const grads = ["hot", "flame"].map(id => document.getElementById(id)?.outerHTML || "").join("");
  root.querySelectorAll("svg.ill use").forEach(u => {
    const sym = document.querySelector(u.getAttribute("href")), svg = u.closest("svg");
    if (sym && svg) { svg.innerHTML = `<defs>${grads}</defs>` + sym.innerHTML; svg.setAttribute("xmlns", "http://www.w3.org/2000/svg"); }
  });
}
async function makeImages(say, base) {
  const gal = document.getElementById("gallery");
  if (!window.html2canvas) { say("Не получилось загрузить генератор картинок. Проверь интернет"); return; }
  say("Рисую картинки…");
  inlineSvgs(app); document.documentElement.classList.add("capture");
  const bg = getComputedStyle(document.body).backgroundColor, files = [];
  try {
    for (const [i, pg] of [...document.querySelectorAll(".page")].entries()) {
      const c = await html2canvas(pg, { backgroundColor: bg, scale: 2, logging: false });
      files.push(new File([await new Promise(r => c.toBlob(r, "image/png"))], `${base}-${i + 1}.png`, { type: "image/png" }));
    }
  } catch (e) { say("Не получилось: " + e.message); document.documentElement.classList.remove("capture"); return; }
  document.documentElement.classList.remove("capture");
  gal.replaceChildren(el(files.map(f => { const u = URL.createObjectURL(f); return `<a href="${u}" download="${f.name}"><img src="${u}" alt=""></a>`; }).join(""))); gal.hidden = false;
  if (navigator.canShare && navigator.canShare({ files })) {
    say(`Готово: ${files.length} картинки`);
    const sh = document.createElement("button"); sh.className = "btn"; sh.textContent = "Отправить картинки";
    sh.onclick = () => navigator.share({ files }).catch(() => {}); gal.before(sh);
  } else say(`Готово: ${files.length} картинки. Нажми, чтобы скачать, или зажми и сохрани`);
}

// ---------- старт ----------
const opened = parseLink(location.href);
if (opened) renderShared(opened); else renderIntro();
</script>
